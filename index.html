<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2027 DSE 倒數計時器 - 倒數與鼓勵，陪你行過每一步">
    <title>2027 DSE 倒數計時器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🎓 2027 DSE 倒數計時器</h1>
            <p class="subtitle">加油！每一步都值得驕傲，繼續前行。</p>
        </header>

        <!-- DSE Exam Season Progress Bar -->
        <div class="exam-progress-section" id="examProgressSection"></div>

        <!-- Site notice -->
        <div id="siteNotice" class="site-notice" style="display:none"></div>

        <!-- Hero Countdown for First DSE Written Exam -->
        <div class="hero-countdown" id="heroCountdown">
            <!-- Will be dynamically populated -->
        </div>

        <!-- Freedom Countdown -->
        <div class="freedom-countdown" id="freedomCountdown">
            <!-- Will be dynamically populated -->
        </div>

        <div class="floating-controls">
            <button id="articleBtn" class="control-btn" aria-label="每日一篇">
                <span>📖 每日一篇</span>
            </button>
            <button id="settingsBtn" class="control-btn" aria-label="選擇科目">
                <span>⚙️ 選擇科目</span>
            </button>
        </div>

        <div id="subjectModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>選擇你嘅考試科目</h2>
                    <span class="close-modal" id="closeSubjectModal">&times;</span>
                </div>
                <!-- ... content ... -->
                <div class="modal-body">
                    <div class="settings-section-title">選擇科目 Select Subjects</div>
                    <div class="subject-buttons" id="subjectButtons"></div>
                    
                    <div class="custom-dates-section" id="customDateInputs">
                        <h3>自訂考試日期 Custom Dates</h3>
                        <div class="date-input-group">
                            <label for="engOralDate">英國語文（四）（口試） English Language Paper 4 (Speaking)</label>
                            <div class="input-wrapper">
                                <input type="datetime-local" id="engOralDate">
                                <button id="clearOralDate" class="clear-btn" title="清除 Clear">✕</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="saveBtn" class="save-btn">儲存並開始</button>
                </div>
            </div>
        </div>

        <div id="welcomeModal" class="modal">
            <div class="modal-content welcome-modal-content">
                <div class="modal-header">
                    <h2>恭喜晒 2026 DSE 同學</h2>
                    <span class="close-modal" id="closeWelcomeModal">&times;</span>
                </div>
                <div class="modal-body welcome-body">
                    <p class="welcome-lead">你已完成咗一個重要里程碑，真係好叻！</p>
                    <div class="welcome-highlight">
                        <strong>祝賀：</strong>為你打氣！🎉
                    </div>
                    <p class="welcome-copy">無論下一步係乜，記住保持信心同正能量，我哋喺度支持你。</p>
                    <p class="welcome-copy">按下面按鈕開始使用倒數工具。</p>
                </div>
                <div class="modal-footer welcome-footer">
                    <button id="welcomeActionBtn" class="save-btn">開始吧 • Let’s Go</button>
                </div>
            </div>
        </div>

        <div id="articleModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>每日一篇 Article of the Day</h2>
                    <span class="close-modal" id="closeArticleModal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="daily-article-container" id="dailyArticle">
                        <!-- Daily article content -->
                    </div>
                    <div class="articles-list-section">
                        <h3>範文列表 All Articles</h3>
                        <div class="articles-list" id="articlesList">
                            <!-- List of all 12 articles -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="countdown-grid" id="countdownGrid">
            <!-- Countdown cards will be dynamically inserted here -->
        </div>

        <div class="encouragement">
            <p id="encouragementText">加油！你一定得㗎！💪</p>
        </div>

        <footer class="footer">
            <p>© 2027 DSE 倒數計時器 | 努力唔會背叛你 ✨</p>
        </footer>
    </div>

    <script src="dse_articles.js"></script>
    <script src="chem_game.js"></script>
    <script src="bafs_game.js"></script>
    <script src="script.js"></script>
</body>
</html>
